name: Release host

# Pushing a tag host-v<versionName> (for example host-v1.0.0) builds the signed host and publishes a GitHub release
# with the Magisk zip. host/release.sh does the work, the same script a local release runs.

on:
  push:
    tags: ['host-v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NDK_VERSION: 27.1.12297006
      CMAKE_VERSION: 3.22.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the tag matches the app version
        run: |
          ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' host/android/app/build.gradle.kts)
          if [ "host-v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $ver (expected host-v$ver)"
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the NDK, CMake and build tools
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --licenses < <(yes) > /dev/null
          "$sdkmanager" --install "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" "build-tools;36.0.0" "platforms;android-36" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin" >> "$GITHUB_PATH"

      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.HERMESSIM_SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::secret HERMESSIM_SIGNING_KEYSTORE_B64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HERMESSIM_SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          HERMESSIM_SIGNING_STORE_PASSWORD: ${{ secrets.HERMESSIM_SIGNING_STORE_PASSWORD }}
          HERMESSIM_SIGNING_KEY_ALIAS: ${{ secrets.HERMESSIM_SIGNING_KEY_ALIAS }}
          HERMESSIM_SIGNING_KEY_PASSWORD: ${{ secrets.HERMESSIM_SIGNING_KEY_PASSWORD }}
        run: host/release.sh --github

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
